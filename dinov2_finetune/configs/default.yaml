seed: 42
num_folds: 5
folds_dir: folds
output_dir: outputs

model:
  model_name: dinov2-base
  num_classes: 1
  dropout: 0.1
  freeze_backbone: false

data:
  image_size: 224
  num_workers: 4
  batch_size: 32
  valid_batch_size: 32
  train_image_columns:
    - 外观检查_1
    - 外观检查_2
    - 颈围、甲颏距离和胸颏距离_1
    - 颈围、甲颏距离和胸颏距离_2
    - 张口度_1
    - 上唇咬合试验_1
    - 牙齿检查_1
    - Mallampati分级_1

optim:
  epochs: 100
  lr: 1.0e-5
  weight_decay: 1.0e-4
  warmup_ratio: 0.1

train:
  use_amp: true
  grad_accum_steps: 1
  max_grad_norm: 1.0
  log_interval: 20
  early_stop_patience: 50
  decision_threshold: 0.5

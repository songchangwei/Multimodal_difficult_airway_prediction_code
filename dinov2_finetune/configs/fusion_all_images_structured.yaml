seed: 42
num_folds: 5
folds_dir: folds
output_dir: outputs

model:
  model_name: dinov2-base
  # Each image checkpoint is loaded from the same fold and frozen.
  checkpoint_template: outputs/{image_column}/fold_{fold}/best.pt
  hidden_dim: 256
  structured_hidden_dim: 64
  dropout: 0.2

data:
  data_root: data
  image_size: 224
  num_workers: 4
  feature_batch_size: 32
  train_batch_size: 64
  valid_batch_size: 128
  # Eight currently trained image columns, in concatenation order.
  image_columns:
    - 外观检查_1
    - 外观检查_2
    - 颈围、甲颏距离和胸颏距离_1
    - 颈围、甲颏距离和胸颏距离_2
    - 张口度_1
    - 上唇咬合试验_1
    - 牙齿检查_1
    - Mallampati分级_1

structured:
  # These are baseline demographic/body-size variables only.
  categorical_columns:
    - 性别
    - 种族
    - age_group
    - bmi_group
  numerical_columns:
    - age
    - height_cm
    - weight_kg
    - BMI
    - age_squared
    - bmi_squared
    - age_bmi

optim:
  epochs: 100
  lr: 1.0e-3
  weight_decay: 1.0e-4
  warmup_ratio: 0.1

train:
  use_amp: true
  grad_accum_steps: 1
  max_grad_norm: 1.0
  log_interval: 20
  early_stop_patience: 20
  decision_threshold: 0.5

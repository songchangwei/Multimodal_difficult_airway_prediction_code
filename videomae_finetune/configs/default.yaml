seed: 42
num_folds: 5
folds_dir: folds
output_dir: video_outputs

model:
  model_name: videomae-base
  dropout: 0.1
  freeze_backbone: false

data:
  num_frames: 16
  image_size: 224
  sampling_strategy: uniform
  num_workers: 2
  batch_size: 16
  valid_batch_size: 4
  train_video_columns:
    - 前屈和后仰_1
    - 前屈和后仰_2

optim:
  epochs: 100
  lr: 1.0e-5
  weight_decay: 1.0e-4
  warmup_ratio: 0.1

train:
  use_amp: true
  grad_accum_steps: 1
  max_grad_norm: 1.0
  log_interval: 10
  early_stop_patience: 5
  decision_threshold: 0.5
